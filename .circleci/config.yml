version: 2.1

setup: true

parameters:
  ci_execution_context:
    type: string
    default: normal
  run_reproducibility:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  route:
    docker:
      - image: cimg/node:24.19.0

    environment:
      CI_BASE_REVISION: main
      CI_REQUESTED_EXECUTION_CONTEXT: << pipeline.parameters.ci_execution_context >>
      CI_REQUESTED_REPRODUCIBILITY: << pipeline.parameters.run_reproducibility >>

    steps:
      - checkout

      - run:
          name: Verify pinned Node.js runtime
          command: |
            expected_node_version="$(cat .nvmrc)"
            actual_node_version="$(node -p 'process.versions.node')"
            test "$actual_node_version" = "$expected_node_version"

      - run:
          name: Install Node.js dependencies
          command: npm ci

      - run:
          name: Build CI routing implementation
          command: npm run build

      - run:
          name: Resolve verification routing
          command: |
            node scripts/ci/route-pipeline.mjs /tmp/continuation-parameters.json
            cat /tmp/continuation-parameters.json

      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/continuation-parameters.json

workflows:
  setup:
    jobs:
      - route:
          filters:
            branches:
              only: /.*/
            tags:
              only: /.*/
