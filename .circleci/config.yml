version: 2.1

jobs:
  walking-skeleton:
    machine:
      image: ubuntu-2404:current

    steps:
      - checkout

      - run:
          name: Install Node.js dependencies
          command: npm install --no-package-lock

      - run:
          name: Lint TypeScript
          command: npm run lint

      - run:
          name: Type check
          command: npm run typecheck

      - run:
          name: Build TypeScript
          command: npm run build

      - run:
          name: Reset Redmine test environment
          command: npm run redmine:reset

      - run:
          name: Run RedmineClient integration test
          command: |
            export REDMINE_URL="http://localhost:3000"
            export REDMINE_API_KEY="0123456789abcdef0123456789abcdef01234567"
            npm run test:integration

      - run:
          name: Run MCP E2E test
          command: |
            export REDMINE_URL="http://localhost:3000"
            export REDMINE_API_KEY="0123456789abcdef0123456789abcdef01234567"
            npm run test:e2e

      - run:
          name: Verify repeatable Redmine reset
          command: npm run redmine:reset

      - run:
          name: Run integration test after second reset
          command: |
            export REDMINE_URL="http://localhost:3000"
            export REDMINE_API_KEY="0123456789abcdef0123456789abcdef01234567"
            npm run test:integration

      - run:
          name: Stop Docker Redmine
          command: npm run redmine:stop
          when: always

workflows:
  test:
    jobs:
      - walking-skeleton
