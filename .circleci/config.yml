version: 2.1

jobs:
  test:
    machine:
      image: ubuntu-2404:current

    environment:
      REDMINE_URL: http://localhost:3000
      REDMINE_API_KEY: 0123456789abcdef0123456789abcdef01234567
      REDMINE_WRITE_API_KEY: fedcba9876543210fedcba9876543210fedcba98

    steps:
      - checkout

      - run:
          name: Install pinned Node.js runtime
          command: |
            NODE_VERSION="$(cat .nvmrc)"
            PROJECT_DIR="$PWD"

            # CircleCI machine image にプリインストールされている nvm を使用する。
            export NVM_DIR="/opt/circleci/.nvm"

            # .nvmrc がまだインストールされていない Node.js を指している場合、
            # project directory で nvm.sh を読み込むと exit 3 になることがある。
            # .nvmrc の存在しないディレクトリで nvm を初期化する。
            cd /tmp
            . "$NVM_DIR/nvm.sh"
            cd "$PROJECT_DIR"

            nvm install "$NODE_VERSION"
            nvm use "$NODE_VERSION"

            # 後続の CircleCI run step でも同じ Node.js runtime を使用する。
            {
              echo 'export NVM_DIR="/opt/circleci/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm use --silent "$(cat .nvmrc)" >/dev/null'
            } >> "$BASH_ENV"

      - run:
          name: Verify Node.js runtime
          command: |
            expected_node_version="$(cat .nvmrc)"
            actual_node_version="$(node -p 'process.versions.node')"

            echo "Node.js: $(node --version)"
            echo "npm: $(npm --version)"

            test "$actual_node_version" = "$expected_node_version"

      - run:
          name: Install Node.js dependencies
          command: npm ci

      - run:
          name: Run ESLint
          command: npm run lint

      - run:
          name: Run TypeScript type check
          command: npm run typecheck

      - run:
          name: Build TypeScript
          command: npm run build

      - run:
          name: Run unit tests
          command: npm run test:unit

      - run:
          name: Reset Redmine test environment
          command: npm run redmine:reset

      - run:
          name: Run RedmineClient integration tests
          command: npm run test:integration

      - run:
          name: Reset Redmine test environment before E2E
          command: npm run redmine:reset

      - run:
          name: Run MCP end-to-end tests
          command: npm run test:e2e

      - run:
          name: Reset Redmine test environment again
          command: npm run redmine:reset

      - run:
          name: Run integration tests after second reset
          command: npm run test:integration

      - run:
          name: Stop Redmine test environment
          command: npm run redmine:stop
          when: always

workflows:
  test:
    jobs:
      - test
